<!DOCTYPE html>
<html>
<head>
    
    <title>inventoryId management</title>
    <link rel="stylesheet" href="style.css">
</head>
<center>
<body>
    
    <h1>inventoryId management</h1>

    <h3>product add</h3>
    <form id="productform">
        <label for="proId">product Id</label>
        <input type="text" id="proId" placeholder="productid">
        <label type="pname">productname</label>
        <input type="text" id="pname" placeholder="productname">
        <label for="amount">amount</label>
     
        <input type="number" id="amount" placeholder="amount">
        <label for="quanty">quanty</label>
       
        <input type="number" id="quanty" placeholder="quanty">
        <button class ="button1" onclick="productadd(event)">add</button>

    </form>
    <h3>productsearch</h3>
    <input type="text" id="search" placeholder="enter the product number">
    <button class="button2" onclick="productget()">search</button>

    <h3>product details</h3>
    <p id="output"></p>

    <script>
        let productcatalog=[];
        
        function productadd(event)
        {
            event.preventDefault();
            let proid=document.getElementById("proId").value.trim()
            let name=document.getElementById("pname").value.trim()
            let amount=parseFloat(document.getElementById("amount").value)
            let quanty=parseFloat(document.getElementById("quanty").value)

            if(proid && name && !isNaN(amount) && !isNaN(quanty))
        {
            productcatalog.push({proid:proid,name:name,amount:amount,quanty:quanty})
            alert("the product add succes")
            document.getElementById("productform").reset()
        }
        else{
            alert("enter the correct value")
        }

        }
        function productget(){
            let search=document.getElementById("search").value.trim()
            let product=productcatalog.find(p=>p.proid===search)
            if(product)
        {
            document.getElementById("output").innerHTML=`product name ${product.name} <br> amount ${product.amount} <br> quanty ${product.quanty}`;

        }
        else{
            document.getElementById("output").innerHTML=`the product is not found`;
        }

        }
    </script>

</body>
</center>
</html>
